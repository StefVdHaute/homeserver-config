services:
  portainer:
    image: portainer/portainer-ce:2
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    environment:
      - TZ=${TZ}
    networks:
      - proxy

volumes:
  portainer_data:

networks:
  proxy:
    external: true
