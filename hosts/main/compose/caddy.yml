services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # ACME cert files (wildcard cert for *.${DOMAIN}) — populated and
      # renewed by NixOS security.acme on the host. DOMAIN here must match
      # site.acmeDomain in /etc/nixos/site.nix.
      - /var/lib/acme/${DOMAIN}:/etc/caddy/certs:ro
    environment:
      - DOMAIN=${DOMAIN}
      - TZ=${TZ}
    # Caddy runs as root in-container; add the caddy-certs GID so it can
    # read the mode 0640 cert files (owned acme:caddy-certs on the host).
    group_add:
      - "2100"
    # Let Caddy reach NixOS services that run on the host (AdGuard UI at
    # 127.0.0.1:3000). `host-gateway` resolves to the Docker bridge's
    # host IP at runtime (Docker 20.10+).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
