services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - ../homepage:/srv/homepage:ro
      - caddy_data:/data
      - caddy_config:/config
      # Wildcard cert from NixOS security.acme; DOMAIN must match site.acmeDomain.
      - /var/lib/acme/${DOMAIN}:/etc/caddy/certs:ro
    environment:
      - DOMAIN=${DOMAIN}
      - TZ=${TZ}
    # caddy-certs GID, to read the 0640 cert files.
    group_add:
      - "2100"
    # Reaches host services (AdGuard UI on 3000).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    # Caddy admin API, on 2019 inside the container.
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first and the
      # admin API only listens on IPv4 loopback.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
