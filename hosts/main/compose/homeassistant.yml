services:
  # Runs on each `docker compose up` of this stack (not on a plain container
  # restart). Seeds configuration.yaml, and makes HA trust Caddy; without that HA answers 400 to every proxied
  # request.
  #
  # Since 2026.11 HA ignores `http:` in configuration.yaml after a one-time
  # migration into .storage/http, where it lands as a "pending" config that
  # must be confirmed in the UI within 5 minutes or HA reverts it and
  # restarts. Behind a proxy that confirmation is easy to miss, so the trust
  # settings are written straight into the "stable" slot instead.
  homeassistant-init:
    image: alpine:3
    container_name: homeassistant-init
    restart: "no"
    volumes:
      - homeassistant_config:/config
    command:
      - sh
      - -ec
      - |
        cfg=/config/configuration.yaml
        store=/config/.storage/http
        if [ ! -e "$$cfg" ]; then
          # Home Assistant's own default config.
          cat > "$$cfg" <<'EOF'
        default_config:

        frontend:
          themes: !include_dir_merge_named themes

        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml
        EOF
          mkdir -p /config/themes
          [ -e /config/automations.yaml ] || echo "[]" > /config/automations.yaml
          touch /config/scripts.yaml /config/scenes.yaml
          echo "wrote default configuration.yaml"
        fi
        # An http: block here would be ignored, and flagged as deprecated.
        if grep -q '^http:' "$$cfg"; then
          echo "WARNING: remove the http: block from configuration.yaml; HA ignores it, see .storage/http" >&2
        fi
        apk add --no-cache --quiet jq >&2
        # Caddy on the Docker `proxy` network (hosts/main/compose/caddy.yml).
        proxy='{"use_x_forwarded_for": true, "trusted_proxies": ["172.16.0.0/12"]}'
        mkdir -p /config/.storage
        if [ ! -e "$$store" ]; then
          # Fresh install: HA's default HTTP config plus the proxy trust,
          # already stable and migrated (storage format 3, HA 2026.11).
          jq -n --argjson p "$$proxy" --arg now "$$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" '{
            version: 3, minor_version: 1, key: "http",
            data: {
              stable: ({
                server_port: 8123,
                cors_allowed_origins: ["https://cast.home-assistant.io"],
                login_attempts_threshold: -1,
                ip_ban_enabled: true,
                ssl_profile: "intermediate_v6",
                use_x_frame_options: true,
                created_at: $$now, error: null, error_message: null
              } + $$p),
              pending: null,
              yaml_migration_done: true
            }}' > "$$store"
          echo "wrote .storage/http with proxy trust"
        elif jq -e '.data.stable.use_x_forwarded_for == true' "$$store" >/dev/null; then
          echo ".storage/http already trusts the proxy"
        elif jq -e '.version == 3' "$$store" >/dev/null; then
          # Existing install without proxy trust (e.g. a reverted pending
          # config): put it in stable and drop the pending trial.
          jq --argjson p "$$proxy" '.data.stable += $$p | .data.pending = null' "$$store" > "$$store.tmp"
          mv "$$store.tmp" "$$store"
          echo "added proxy trust to .storage/http"
        else
          # Unknown storage format after an HA upgrade: don't guess, but
          # don't block HA from starting either.
          echo "WARNING: .storage/http has an unknown format; proxy trust not set, HA will answer 400 behind Caddy" >&2
        fi

  homeassistant:
    # No major-only tags upstream; WUD flags newer releases.
    image: ghcr.io/home-assistant/home-assistant:2026.11.0
    container_name: homeassistant
    restart: unless-stopped
    depends_on:
      homeassistant-init:
        condition: service_completed_successfully
    volumes:
      - homeassistant_config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
    # Bridge network behind Caddy like the other services: no host
    # networking, so mDNS/SSDP auto-discovery doesn't reach the LAN;
    # integrations are added by IP. USB radios (Zigbee/Z-Wave) would need a
    # `devices:` entry.
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8123/manifest.json || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  homeassistant_config:

networks:
  proxy:
    external: true
