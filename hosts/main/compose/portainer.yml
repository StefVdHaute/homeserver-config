services:
  portainer:
    image: portainer/portainer-ce:2.43.0
    container_name: portainer
    restart: unless-stopped
    # Skips the first-run wizard, whose open /api/users/admin/init lets
    # anyone claim admin (docker.sock → host root).
    command: ["--admin-password=${PORTAINER_ADMIN_PASSWORD_HASH}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    environment:
      - TZ=${TZ}
    networks:
      - proxy

volumes:
  portainer_data:

networks:
  proxy:
    external: true
