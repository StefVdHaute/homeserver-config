services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.6.5079-ls48
    container_name: lidarr
    labels:
      - wud.tag.include=^\d+\.\d+\.\d+\.\d+-ls\d+$$
    restart: unless-stopped
    volumes:
      - lidarr_config:/config
      # Same path as in slskd (compose/slskd.yml), so an import from
      # /music/downloads to /music/library is a move on one filesystem.
      - /mnt/data/music:/music
    environment:
      # operator:users, the owner of /mnt/data/music.
      - PUID=1000
      - PGID=100
      # Fixed API key, so Soularr (compose/soularr.yml) can use it.
      - LIDARR__AUTH__APIKEY=${LIDARR_API_KEY}
      - TZ=${TZ}
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8686/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  lidarr_config:

networks:
  proxy:
    external: true
