services:
  ntfy:
    image: binwiederhier/ntfy:v2
    container_name: ntfy
    restart: unless-stopped
    command: serve
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=https://ntfy.${DOMAIN}
      - NTFY_BEHIND_PROXY=true
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
      # No NTFY_AUTH_FILE — tailnet membership is the authentication
      # (see CLAUDE.md Notifications section). See TODO.md for the
      # "harden if ever exposed beyond tailnet" follow-up.
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    ports:
      - "127.0.0.1:8085:80"
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/v1/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  ntfy_cache:
  ntfy_data:

networks:
  proxy:
    external: true
