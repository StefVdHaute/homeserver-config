services:
  joplin-db:
    image: postgres:16-alpine
    container_name: joplin-db
    restart: unless-stopped
    volumes:
      - joplin_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${JOPLIN_DB_NAME}
      - POSTGRES_USER=${JOPLIN_DB_USER}
      - POSTGRES_PASSWORD=${JOPLIN_DB_PASSWORD}
    networks:
      - joplin-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOPLIN_DB_USER} -d ${JOPLIN_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  joplin:
    image: joplin/server:3.7.1
    container_name: joplin
    restart: unless-stopped
    environment:
      - APP_BASE_URL=https://joplin.${DOMAIN}
      - APP_PORT=22300
      - DB_CLIENT=pg
      - POSTGRES_HOST=joplin-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${JOPLIN_DB_NAME}
      - POSTGRES_USER=${JOPLIN_DB_USER}
      - POSTGRES_PASSWORD=${JOPLIN_DB_PASSWORD}
      - TZ=${TZ}
    networks:
      - proxy
      - joplin-backend
    depends_on:
      joplin-db:
        condition: service_healthy
    healthcheck:
      # The image has no wget/curl, and Joplin answers 404 "Invalid origin"
      # unless the Host header matches APP_BASE_URL.
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:22300,path:'/api/ping',headers:{Host:new URL(process.env.APP_BASE_URL).host}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # One-shot: replaces the default admin@localhost / admin password with
  # JOPLIN_ADMIN_PASSWORD once joplin is healthy. Idempotent.
  joplin-init:
    image: alpine:3
    container_name: joplin-init
    restart: "no"
    depends_on:
      joplin:
        condition: service_healthy
    environment:
      - JOPLIN_ADMIN_PASSWORD=${JOPLIN_ADMIN_PASSWORD}
      # Joplin rejects requests whose Host doesn't match APP_BASE_URL.
      - JOPLIN_HOST=joplin.${DOMAIN}
    networks:
      - joplin-backend
    # Only a 403 (default login refused) counts as "already rotated"; any
    # other answer fails the container, so the default admin/admin login
    # can't survive silently.
    command:
      - sh
      - -ec
      - |
        apk add --no-cache --quiet curl jq >&2
        code=$$(curl -s -o /tmp/session.json -w '%{http_code}' -X POST \
          -H "Host: $$JOPLIN_HOST" \
          -H "Content-Type: application/json" \
          -d '{"email":"admin@localhost","password":"admin"}' \
          http://joplin:22300/api/sessions)
        case "$$code" in
          200) ;;
          403) echo "default admin login refused (already rotated) — skipping"; exit 0 ;;
          *) echo "unexpected HTTP $$code from joplin: $$(head -c 200 /tmp/session.json)" >&2; exit 1 ;;
        esac
        TOKEN=$$(jq -r '.id // empty' /tmp/session.json)
        # User IDs are random strings, not 1.
        USER_ID=$$(jq -r '.user_id // empty' /tmp/session.json)
        [ -n "$$TOKEN" ] && [ -n "$$USER_ID" ] || { echo "no session/user id in joplin's answer" >&2; exit 1; }
        echo "logged in with default creds; rotating admin password..."
        curl -fsS -X PATCH \
          -H "Host: $$JOPLIN_HOST" \
          -H "X-Api-Auth: $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "$$(jq -n --arg pw "$$JOPLIN_ADMIN_PASSWORD" '{password: $$pw}')" \
          "http://joplin:22300/api/users/$$USER_ID" >/dev/null
        code=$$(curl -s -o /dev/null -w '%{http_code}' -X POST \
          -H "Host: $$JOPLIN_HOST" \
          -H "Content-Type: application/json" \
          -d '{"email":"admin@localhost","password":"admin"}' \
          http://joplin:22300/api/sessions)
        [ "$$code" = 403 ] || { echo "default login still answers HTTP $$code after rotation" >&2; exit 1; }
        echo "admin password rotated (default login now refused)"

volumes:
  joplin_db:

networks:
  proxy:
    external: true
  joplin-backend:
