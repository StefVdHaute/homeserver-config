services:
  joplin-db:
    image: postgres:16-alpine
    container_name: joplin-db
    restart: unless-stopped
    volumes:
      - joplin_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${JOPLIN_DB_NAME}
      - POSTGRES_USER=${JOPLIN_DB_USER}
      - POSTGRES_PASSWORD=${JOPLIN_DB_PASSWORD}
    networks:
      - joplin-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOPLIN_DB_USER} -d ${JOPLIN_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  joplin:
    image: joplin/server:3.7.1
    container_name: joplin
    restart: unless-stopped
    environment:
      - APP_BASE_URL=https://joplin.${DOMAIN}
      - APP_PORT=22300
      - DB_CLIENT=pg
      - POSTGRES_HOST=joplin-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${JOPLIN_DB_NAME}
      - POSTGRES_USER=${JOPLIN_DB_USER}
      - POSTGRES_PASSWORD=${JOPLIN_DB_PASSWORD}
      - TZ=${TZ}
    networks:
      - proxy
      - joplin-backend
    depends_on:
      joplin-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:22300/api/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # One-shot init: rotates the upstream-default admin@localhost / admin
  # password to JOPLIN_ADMIN_PASSWORD as soon as joplin is healthy.
  # Closes the LAN-reachable default-creds window. Idempotent — on
  # subsequent runs the default login fails, container exits 0.
  joplin-init:
    image: alpine:3
    container_name: joplin-init
    restart: "no"
    depends_on:
      joplin:
        condition: service_healthy
    environment:
      - JOPLIN_ADMIN_PASSWORD=${JOPLIN_ADMIN_PASSWORD}
    networks:
      - joplin-backend
    command:
      - sh
      - -ec
      - |
        apk add --no-cache --quiet curl jq >&2
        TOKEN=$$(curl -fsS -X POST \
          -H "Content-Type: application/json" \
          -d '{"email":"admin@localhost","password":"admin"}' \
          http://joplin:22300/api/sessions 2>/dev/null | jq -r '.id // empty')
        if [ -z "$$TOKEN" ]; then
          echo "default admin login failed (already initialized) — skipping"
          exit 0
        fi
        echo "logged in with default creds; rotating admin password..."
        curl -fsS -X PATCH \
          -H "X-Api-Auth: $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "$$(jq -n --arg pw "$$JOPLIN_ADMIN_PASSWORD" '{password: $$pw}')" \
          http://joplin:22300/api/users/1
        echo "admin password rotated"

volumes:
  joplin_db:

networks:
  proxy:
    external: true
  joplin-backend:
